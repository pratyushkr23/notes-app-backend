<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notes App</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- AUTH PAGE -->

  <div class="container" id="authPage">

    <h1>📝 Notes App</h1>

    <div class="auth-box">

      <input
        type="email"
        id="email"
        placeholder="Enter email"
      />

      <input
        type="password"
        id="password"
        placeholder="Enter password"
      />

      <div class="button-group">

        <button onclick="register()">
          Register
        </button>

        <button onclick="login()">
          Login
        </button>

      </div>

      <p id="authMessage"></p>

    </div>

  </div>

  <!-- DASHBOARD -->

  <div class="container hidden" id="dashboardPage">

    <div class="top-bar">

      <h1>Your Notes</h1>

      <div>

        <button onclick="showAbout()">
          About
        </button>

        <button onclick="logout()">
          Logout
        </button>

      </div>

    </div>

    <!-- ABOUT SECTION -->

    <div id="aboutMessage"></div>

    <!-- FEATURE SECTION -->

    <div class="feature-box">

      <h3>✨ Feature Added</h3>

      <p>
        Users can securely share notes with other registered users
        using email-based note sharing.
      </p>

    </div>

    <!-- CREATE NOTE -->

    <div class="note-section">

      <input
        type="text"
        id="title"
        placeholder="Note title"
      />

      <textarea
        id="content"
        placeholder="Write your note"
      ></textarea>

      <button onclick="createNote()">
        Create Note
      </button>

      <p id="noteMessage"></p>

    </div>

    <div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="Search notes"
    />

    <button onclick="searchNotes()">
        Search
    </button>

    </div>

    <!-- NOTES LIST -->

    <div class="notes-list">

      <button onclick="getNotes()">
        Refresh Notes
      </button>

      <div id="notes"></div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
